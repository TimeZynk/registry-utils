# Test tagged releases, create a GitHub Release, and publish to npm using OIDC.
# npm trusted publisher: TimeZynk/registry-utils, workflow npmpublish.yml.

name: Release & Publish

on:
    # Auto when you run `npm version` and push the tag (e.g., v0.8.0)
    push:
        tags:
            - 'v*'
    # Also support creating a GitHub Release via UI/CLI
    release:
        types: [created]

permissions:
    contents: read

jobs:
    build_and_test:
        name: Install, Lint, Build, Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # keep tags available

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  check-latest: true
                  cache: 'npm'
                  registry-url: https://registry.npmjs.org/

            - run: node -v && npm -v
            - run: npm ci --include=dev
            - run: npm run lint --if-present
            - run: npm run build --if-present
            - run: npm test
              env:
                  CI: true

    create_release:
        name: Create GitHub Release (from tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        needs: build_and_test
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7

            - name: Verify tag matches package.json version
              id: verify
              run: |
                  TAG="${GITHUB_REF_NAME}"                       # e.g. v0.8.0
                  PKG_VERSION="v$(node -p "require('./package.json').version")"
                  echo "Tag: $TAG ; package.json: $PKG_VERSION"
                  if [ "$TAG" != "$PKG_VERSION" ]; then
                    echo "Tag and package.json version mismatch."
                    exit 1
                  fi
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ steps.verify.outputs.tag }}
                  name: ${{ steps.verify.outputs.tag }}
                  generate_release_notes: true
                  make_latest: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    publish_npm:
        name: Publish to npm (trusted publishing)
        needs: build_and_test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  check-latest: true
                  registry-url: https://registry.npmjs.org/
                  package-manager-cache: false

            # Trusted publishing requires npm >=11.5.1.
            - run: npm install --global npm@11.6.2
            - run: node -v && npm -v
            - run: npm ci --include=dev
            - run: npm run lint --if-present
            - run: npm run build --if-present
            - run: npm test
              env:
                  CI: true

            # npm exchanges GitHub's OIDC token for a short-lived publish credential.
            # Provenance is generated automatically for trusted publishing.
            - run: npm publish --access public
